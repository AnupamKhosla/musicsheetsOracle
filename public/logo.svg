<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="MusicSheets — tanpura note on a staff">
  <defs>
    <linearGradient id="msRose" x1="12" y1="8" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="msGold" x1="22" y1="8" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Western staff: the sheet the note stands on -->
  <g stroke="#BE123C" stroke-opacity="0.26" stroke-width="1.5" stroke-linecap="round">
    <line x1="5" y1="24" x2="59" y2="24"/>
    <line x1="5" y1="31" x2="59" y2="31"/>
    <line x1="5" y1="38" x2="59" y2="38"/>
    <line x1="5" y1="45" x2="59" y2="45"/>
  </g>

  <!-- Tanpura neck doubling as the note stem -->
  <path d="M33 47 L33 11" stroke="url(#msRose)" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Frets on the neck -->
  <g stroke="url(#msGold)" stroke-width="2.2" stroke-linecap="round">
    <line x1="29.5" y1="19" x2="36.5" y2="19"/>
    <line x1="29.5" y1="25.5" x2="36.5" y2="25.5"/>
    <line x1="29.5" y1="32" x2="36.5" y2="32"/>
  </g>

  <!-- Flowing flag — a meend glide off the top of the stem -->
  <path d="M33 11 C42 12.5, 48 18, 46.5 27 C45.8 31.5, 42.5 34, 39 34.5" stroke="url(#msGold)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Tanpura gourd as the notehead -->
  <ellipse cx="24" cy="49" rx="9.5" ry="8.2" fill="url(#msRose)" transform="rotate(-18 24 49)"/>

  <!-- Sound-hole / bindi on the gourd -->
  <circle cx="23.5" cy="49" r="2.2" fill="#FFF1F2"/>
</svg>
