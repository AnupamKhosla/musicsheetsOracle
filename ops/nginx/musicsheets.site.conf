# =============================================================================
# musicsheets.site — Nginx site configuration (TEMPLATE)
# =============================================================================
# This is the live config versioned from the VPS for documentation.
# Sensitive values (if any) use {{PLACEHOLDER}} syntax — replace before deploying.
#
# Sections:
#   1. Rate limiting zones (shared memory, global)
#   2. Server block: SSL, Tailscale Funnel, Cloudflare real IP, Gzip, Proxy
#   3. HTTP→HTTPS redirect (Certbot managed)
#
# To deploy:
#   sudo cp ops/nginx/musicsheets.site.conf /etc/nginx/sites-available/musicsheets.site
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================


# ---------------------------------------------------------------------------
# 1. RATE LIMITING ZONES
# ---------------------------------------------------------------------------
# These must be at http level (site configs are included inside the http block).
# - static:  100 req/s per IP, burst 50  (frontend assets, pages)
# - dynamic:  50 req/s per IP, burst 25  (API routes)
# Both use $binary_remote_addr key (Real IP resolved from Cloudflare headers).
# 10m zone = ~160k unique IPs tracked.

limit_req_zone $binary_remote_addr zone=static:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=dynamic:10m rate=50r/s;


# ---------------------------------------------------------------------------
# 2. MAIN SERVER BLOCK (SSL + HTTP/2 + Tailscale Funnel)
# ---------------------------------------------------------------------------
server {
    # Domains served
    server_name musicsheets.site www.musicsheets.site musicsheets.tail0c6a25.ts.net;

    # -- Cloudflare real IP resolution --
    # Without this, $binary_remote_addr = Cloudflare IP, making rate limiting
    # apply to all users equally. These IPs are Cloudflare's documented ranges.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # -- Gzip compression --
    # Critical for Tailscale Funnel: main JS bundle is 1.5MB raw → ~380KB gzipped.
    # gzip_static: serves pre-compressed .gz files from build (zero CPU per request).
    # falls back to on-the-fly gzip if no .gz file exists (e.g., API responses).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        # Text
        text/plain
        text/css
        text/html
        text/javascript
        text/xml
        text/csv
        text/markdown             # .md files
        text/cache-manifest
        text/calendar
        text/vcard
        text/vtt                  # .vtt subtitles
        text/x-component
        # Application
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/vnd.api+json
        application/geo+json
        application/xml
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/rdf+xml
        application/x-web-app-manifest+json
        application/wasm          # WebAssembly
        application/xliff+xml
        # Fonts (text-based, NOT woff2 — already compressed)
        application/vnd.ms-fontobject
        application/font-woff
        application/x-font-woff
        application/x-font-ttf
        font/otf
        font/ttf
        font/collection
        font/eot
        # Images (text-based — SVG, BMP, ICO)
        image/svg+xml
        image/bmp
        image/vnd.microsoft.icon  # .ico
        # Audio (MIDI is raw, not pre-compressed)
        audio/midi
        audio/x-midi;

    # -- API routes (POST/GET /api/*) --
    # Rate limited: 50 req/s per real IP, burst 25, excess returns 429.
    location /api/ {
        limit_req zone=dynamic burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # -- Webhook endpoint (not rate limited) --
    # GitHub sends bursts during push events; rate limiting could drop deploy triggers.
    location /api/webhook {
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # -- Everything else (static files, React SPA, health check) --
    # Rate limited: 100 req/s per real IP, burst 50, excess returns 429.
    location / {
        limit_req zone=static burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # -- Listen directives --
    listen [::]:443 ssl http2 ipv6only=on;    # managed by Certbot
    listen 443 ssl http2;                       # managed by Certbot
    listen 127.0.0.1:8080;                      # Tailscale Funnel (private)
    ssl_certificate /etc/letsencrypt/live/musicsheets.site/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/musicsheets.site/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                           # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                            # managed by Certbot
}


# ---------------------------------------------------------------------------
# 3. HTTP → HTTPS REDIRECT (Certbot managed)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name musicsheets.site www.musicsheets.site;

    if ($host = www.musicsheets.site) {
        return 301 https://$host$request_uri;
    }
    if ($host = musicsheets.site) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
